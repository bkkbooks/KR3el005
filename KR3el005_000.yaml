body:
  text: 先看穴道吉凶囟門即腦蓋一名頂門骨破髓出者不治節梁即鼻梁打斷者不治兩太陽穴即眉稍角骨不治突骨即結喉骨打斷者不治塞骨即結喉下橫骨上空陷處打斷者不治橫骨下人字骨離一寸三分為一節受傷者下一節更重一節心窩即人字骨處又名龍潭穴打傷暈悶者久候必死丹田臍下一寸三分之內即膀胱也倒插傷者不治一月當亡卵子捏碎及傷破者不治腦後骨骨破者不治百勞穴與塞骨相對傷斷者不治天柱骨與結喉骨相對傷斷者不治兩腎穴在脊背與臍相對之左右各離一寸三分打破者或笑或哭不治尾巴骨打碎者不治海底穴大小便兩界中間傷重者不治軟骨在兩乳下即食肚倒插傷者不治氣門左乳上動脈處受傷則氣塞救遲者不過三時血海右乳下軟肋打傷者不治兩乳左乳受傷者則咳右乳受傷者則厄皆不治看傷吉凶一看兩眼兩眼有瘀血者則白睛必有瘀血之筋血筋多者瘀血必多血筋少者瘀血亦少兩眼活動者易治不動者難治二看手指甲以我手指甲掐其手指甲放手即還原色者易治少頃始還原色者傷重手指甲紫黑者不治三看陽物不縮者可治縮者難治卵子縮者亦不治婦人乳縮者不治四看腳指甲與手指甲同法五看腳底紅活色者易治黃色者難治手掌亦同犯五凶象者不治如犯一二凶象者尚可治凡人受向上打傷者為順氣平拳打傷者為塞氣倒插打傷者為逆氣其症最凶夫人身之血隨氣轉氣順則血順行氣逆則血逆滯血滯則病成何堪加以骨碎筋斷其不至殞命與成殘廢者亦大幸事全賴醫者有旋乾轉坤之力也蓋前心與後心相對傷久成癆小腹與膀胱相連傷久成黃病死診左心小腸肝膽腎右肺大腸脾胃命門傷全體者死速受傷在七日內者當行血至十四日後者有瘀血在胸或大腸作痛當急進行血藥須看患者手指甲黑否及足趾甲黑否黑者為凶面黑者腎有傷肝脈數者胸腹有瘀血當必吐血氣喘急痰響者死目直視或斜視者死唇吊者死失枕者死口臭者死耳之與鼻有赤色者死骨碎色青者死氣喉斷者死胸高者死兩手捏空者死血出不止者死血先赤後黑色者死痛不在傷處者死肌肉腐者死腦骨破者死兩額角邊傷者死天柱骨斷者死耳後腦衣破者死傷兩太陽穴者死傷耳前命門者死頭頂骨碎者死眉毛內傷者死護心骨碎者死傷臂中跳脈者死胸口後背兩腰陰囊陰戶肛門髀內陰骨老人左股壓碎海底穴大腸破出黑屎小腸傷溺團心肺脾肝腎卵子碎凡傷重口目閉牙關緊不進湯水痛極難忍者皆死六脈沉細虛小者死浮大數實者死血出過多脈微緩忽絶者死凡傷重口眼閉不出言語者即以牙皂末吹鼻孔得嚏即能開口如無嚏以燈草蘸井水黏牙皂末點鼻中得嚏即吐痰者可治否則不救隨取韭菜白梗搗汁和童便燉熱灌入口內口納者可治不納者不治如納後同瘀血吐出者辨其輕重先服砂仁泡湯沖吉利散次投清心和氣湯外貼損傷膏傷過重者頭疼昏迷又不吐血急將韭白汁和陳酒服之如骨碎筋斷者以封口藥護之小便閉者以琥珀散通之如腹中作痛內有瘀血用大黃散行之跌打壓僕損傷者須用引經藥上部用川芎手臂用桂枝背脊用白芷藁本胸腹用白芍左肋用青皮右肋用柴胡腰臀用杜仲兩足用木瓜下部用牛膝膝下用黃柏周身用羌活順氣用砂仁青皮木香枳殼通竅用牙皂破血用桃仁蘇木乳香木通活血用紅花茜根三七川芎補血用生地當歸白芍丹參接骨用川斷五加皮骨碎補杜仲婦人用香附大都男子氣從左轉傷上部者易治傷下部者難治以其陽氣上升也女人血從右轉傷下部者易治傷上部者難治以其陰血下降也先以砂仁泡湯和吉利散服之再進順氣活血湯復以砂糖花酒下和傷丸五粒傷肩者左邊則氣促面黃浮腫右邊則氣虛面白血少使患者低坐一人抱住其身將手拔直用推拿法令其筋舒一手捏其肩抵住骱頭齊力拔出然後彎曲其肘骱內有響聲乃復其舊位用布條扣臂於項下服行氣活血湯一月完全傷背者五臟皆繫於背雖凶則死緩先服吉利散次以砂糖花酒送和傷丸五粒如骱骨脫出腰硬痛極用竹六根扎為兩個三腳馬排於兩頭上橫一竹系麻繩圈兩個使患者兩手攀圈每足踏磚三塊醫者將後腰拿住各抽去磚一塊令患者直身又各去磚一塊如是者三次其足著地則骨陷者能起曲者能直先敷定痛散外貼皮紙鋪以艾絨次以杉木四根寬一寸厚五分長短照患處為度俱在側面鑽孔用繩穿貫裹於患上加布扎緊兩邊令端正只可仰臥如無氣者使患者盤坐揪其發伏我膝上輕拍其背心使氣從口出得蘇如胸前不直者亦用竹架攀圈法傷胸者胸為氣血往來之所傷久必咳嗽高起滿悶面黑髮熱主四日死先進疏風理氣湯次以行氣活血湯從前面碰打跌傷胸膛者重從後面者輕用手法按摩之心坎上橫骨第一節傷者一年死第二節傷者二年死第三節傷者三年死傷肝者面紫眼赤發熱主七日內死先投疏風理氣湯次以吉利散後服琥珀丸傷心口者面青氣少呼吸痛甚吐血身體難動主七日內死先進疏風理氣湯次服和傷丸時時飲百合湯傷食肚者心下高腫皮緊陳痛眼閉面與口鼻黑色氣喘發熱飲食不進主七日死先進疏風理氣湯次以和傷丸傷腎者兩耳立聾額黑麵浮白光常如哭狀腫如弓形主半月死先服疏風理氣湯次以補腎活血湯再投吉利散與琥珀丸傷大腸者便後急澀面赤氣阻便後有紅者傷重主半月死先進槐花散次服吉利散後以和傷丸傷小腸者小便閉塞作痛面腫氣喘發熱口乾口有酸水主三日死先以水酒各半煎服疏風理氣湯次以吉利散後送琥珀丸傷膀胱者小便腫脹澀痛不時滴尿發熱主五日死先下琥珀丸次以行氣活血湯傷陰囊或陰戶者血水從小便滴出腫脹痛極昏沉不醒主一日死先與琥珀丸後進行氣活血湯胸與背皆傷者發熱咳嗽面白肉瘦飲食少思主半月死先進理氣湯後以和傷丸傷氣眼者氣喘痛極夜多盜汗身瘦腫脹不安食少主一月死先泡砂仁湯和吉利散服次以酒煎補腎活血湯後進和傷丸傷血海者口常吐血胸與背板硬作痛或血妄行主一月死先進行氣活血湯次以吉利散後服藥酒而安傷兩肋者氣喘大痛睡如刀割面白氣虛主三日死先以行氣活血湯次進和傷丸如筋骨斷者敷定痛散貼損傷膏用布扎數轉服接骨藥兩肋非打傷自痛者乃肝火有餘當以清肝止痛湯有清痰或食積流注兩肋作痛者先以清肺止痛湯次服吉利散登高跌僕血瘀兩肋作痛者急進大黃湯次投吉利散醉飽房勞者多元氣不足肝木克胃土使胸脘連兩肋作痛先投歸原養血湯次以十全大補湯有傷擦或時邪發熱覺兩肋痛者此肝膽二經受邪治以小柴胡湯左肋痛者血瘀與氣滯也先以行氣活血湯次下琥珀丸右肋痛者痰與食積也先以化痰消食方次服活血止痛湯傷處焮紅高腫作痛者乃瘀血為患寒熱交作日輕夜重兼之腰痛肥人多氣虛瘦人多鬱怒急下琥珀散次以和傷丸後進藥酒而安接骨摸法用手細摸所傷之處或骨斷骨碎骨歪骨整骨軟骨硬或筋強筋柔筋歪筋正筋斷筋走筋粗筋翻或為跌撲或為閃錯或為打撞然後依法治之接法接使已斷之骨合攏復歸舊位陷者復起碎者復完突者復平或用手法或用器具分先後而兼用之端法用兩手或用一手擒住應端之骨或從下往上端或從外向內端或直端或斜端骨離位者以手端之送入其臼不使歪斜而骨縫方合庶愈後無長短之患提法提出陷下骨如舊有用兩手提者有用繩帛系高處提者有提後用器具輔之不使仍陷者倘重者輕提則病不愈輕者重提反加新患按摩法按者以手往下抑之摩者徐徐揉摩之因損傷皮膚筋肉腫硬麻木而骨未有折斷者推拿法以手推之使還舊位有用兩手或一手捏定患處緩緩以復其位或因筋急難於轉搖或筋縱難運動或骨節稍有錯落不合縫者當推拿以通經絡之氣血接骨入骱骨之小筍也用手巧法凡人之頭無骱亦無損折只有跌打碎傷等症若腦漿出者不治骨青者難治碎骨如粟米大者可治過大者不治接骨入骱者兩手捏平其筋骨復於舊位或先拽之離而後合或推之就而復位或正其斜或完其缺且骨有截斷碎斷斜斷之分骱有全脫半脫之別筋有弛縱卷攣翻轉離合各門在肉內者用手摸之自知蓋傷有重輕接拿有合宜不合宜之法故愈有遲有速而得完全或遺殘廢者總責乎手法也然體質壯者易愈元氣弱者難全若手法再誤萬難挽回夫骨既斷必使合攏一處復歸原臼出血者敷止血散使血不流再敷金瘡藥用杉木板綁縛撑抵斷處方不移動矣辨明骨有斷為兩截者或折而陷下者或碎而散亂者或岔而旁突者分其形勢接拿使斷者復接陷者復起碎者復完突者復平有皮肉不破而骨斷者動則轆轆有聲或骨受傷未斷者動則無聲或碎骨在肉內者動則淅淅之聲後必潰爛流膿待其爛脫離肉箝去碎骨摻生肌藥外貼損傷膏亦用綁縛始可完全大凡治法先煎代痛散熏洗然後將斷骨拿直令其相對平正按摩果然照舊不歪敷定痛散鋪蓋艾絨綁以杉木板加布條扎好取其緊直使骨縫無綻離走脫之患過四五日放綁復看如其走脫仍依前法扎緊百日內換綁二十餘次內服接骨藥凡斷臂與斷膊斷腿與斷䯒治分上下器具照形體變化有筋全斷者則縮於肉裡無用巧能接之理若斷而未全斷者外敷續筋藥內服壯筋養血藥跌打碰傷頭顱猝死者身雖僵直口鼻尚有出入氣心口尚溫跳動者使患者盤坐揪其發伏我膝上傷處先敷定痛散隨以火紙卷條點火令煙燻其口鼻通和臟腑血脈之氣待口中出聲以熱陳酒和灌定痛散或炒蘿蔔子泡湯灌之外用手摩其胸腋並托其手腕頻頻揉其兩手脈窠被傷之筋脈強硬得揉摩而心脈和運命脈流通即可回生若傷重已死者用白布纏其頭以木棍長尺半圓如錢大輕輕拍其足心再提其發令項正直舒其經絡如皮未破骨碎膜穿血向內流聲啞不言面青唇黑者不治或頂骨塌陷七竅出血身僵昏迷者不治惟皮開肉綻血流不止者先止其血服補氣養血藥當戒欲避風如染破傷風牙關緊閉角弓反張即進疏風理氣湯俟身不發熱與補中益氣湯傷囟門肉腫皮未破者昏沉不語扶起正坐以蔥汁和敷定痛散次以粗紙蘸醋貼藥上燒小尉斗烙紙上內覺熱痛口出聲為度去藥貼損傷膏如皮破血流不止骨陷筋翻者不治凡傷頭頂兩旁稜骨額骨正中兩額角眼眶骨顴骨均照囟門傷治法打傷眼珠落出者先以銀針蘸井水將收珠散點紅筋次用青絹蘸溫湯挪進即服還魂湯再投明目生血飲鼻梁骨斷者先捏正斷骨摻以止血丹如鼻已傷落下者急趁血熱蘸髮炭末黏貼原位不可歪斜加絹條扎緊遲則血冷不能黏服壯筋續骨丹如骨未碎斷只貼損傷膏服吉利散骨碎內膜破者口鼻流血者不治砍跌打落耳朵或上落下黏者或下脫上連者急拈正用封口金瘡藥若全落下者急蘸血餘末貼原位將兩耳相對次以竹片夾緊加布條扎好如耳門骨傷重而體素虧昏沉者不治口唇豁開者先摻麻藥急以小箝箝牢油絲線穿合其縫不可歪斜摻金瘡藥貼損傷膏外以絹條在唇上扎向腦後縛定服活血止痛散常飲稀粥不可言笑及呷食物如血已冷先敷麻藥以刀尖剮破血出時急縱合須手快為妙仍服前藥口含刀誤割其舌將斷未落者急用雞蛋殼內衣貯其舌蜜調敷止血定痛散頻頻添換使患者仰臥稀粥灌飲不動其舌則易愈或戮傷上齶正中之孔面腫色青血流不止痛連腦髓若傷會厭昏沉不語痛連心膈急研鉛粉冰片吹患處以止其血再用蟹黃血竭煎湯每日口漱三十次內服定痛散下頦一骱脫下者遂不便言語飲食其骱如剪刀股樣先以布包手大指入其口余指抵住下邊輕輕捺下用力向上一推而進骱有響聲齒能合者復位多得於腎虛者外加布條兜裹於項後常進補腎養血湯次進補腎丸頸項骨難於損折有登高倒跌損骨外出者重者三時死輕者捏平其骨相對原筍貼損傷膏次以布條連肩背絡之投砂仁泡湯煎吉利散缺盆外鎖子骨傷斷者先拿胸骨將肩頭向內合之揉摩斷骨令其復位加帶挂肩於項敷定痛散不可搖動服接骨藥肋骨斷者骨不能對須捏骨平正外貼損傷膏內服壯筋續骨丹肩骱與膝骱相似肩骱落下手不能舉將上一手擒住其肩下一手拿住其手輕輕轉動使其筋舒再令患者坐於低處一人抱住其身將手拔直用推拿法又兩手捏其肩抵住其臂骨將膝夾住其手齊力推上骱內有骱聲乃復舊位手自能舉動如無響聲者骱未能上仍照前法而行先以熟牛皮長五寸寬三寸兩頭各開二孔貫以棉繩內貼損傷膏加以棉花蓋之又用棉裹如雞卵大夾於夾窩內復以牛皮夾緊肩之前後加布纏好後以扶手板長二寸寬四寸兩頭穿繩懸挂空中令患者俯伏於上不使其肩骨下垂俟全愈方可撤板若不依此法後必遺殘患蘆節服獨活桂枝湯臂骱落出者以上一手抬住其灣下一手拿住其脈踝令其手伸直拔下遂曲其上後抬其灣捏平湊合其攏內有響聲使其手曲轉搭著肩膊骱可合縫矣貼損傷膏多以布每頭釘帶四根裹扎臂骨復以竹簾照患處大小為度圍緊布外使骨縫無參差走脫之患以引經藥煎湯和吉利散手掌處腕骨被跌撲打傷骱骨脫出者腕縫必開以兩手先揉其腕一手拿住其指一手拿住其凹處拔其手指伸直手掌曲起手骱曲下一伸而上骱內有響聲掌可活動已復舊位但骱出不用綁如骨斷者先貼損傷膏加布扎緊將闊板一片撑住患里再以木板四片長三寸加布扎緊俟愈方去板煎桂枝湯和吉利散手指有三骱中節脫出者拔出捏正拈其指伸出挺直一推即上能屈伸則愈不可下水洗以桂枝煎活血止痛飲手指痛過於別處若傷一指痛必連心中指尤甚一染破傷風外敷金瘡藥內服疏風理氣湯被人咬傷手指者先以童便淋洗捏去牙根毒氣用炙龜板灰末麻油和敷又以紙蘸麻油點火熏之如患處破傷風進疏風理氣湯若刀斧砍斫傷者難治臀處肉厚骨粗骱脫比諸骱難於擒拿合攏又名胯骨若骱脫臼者則觸在股內須用大力人四個幫扶使患者側臥一人抱住其身一人擒住膝上先將臂骱拔直上手擒住其腰下手捧住其腿灣將膝曲轉向上使膝近其腹再令伸直骱內有響聲即歸舊臼出左臀攀向右向右拔直而上出右臀攀向左向左拔直而上貼損傷膏服生血補髓湯大腿骨骱脫者一手擒住其膝一手拿住其膀上下拔直將膝曲轉抵住臀瓣骱內有響聲始為合攏敷定痛散服生血補髓藥腿骨折兩段者先煎寬筋散熏洗令患者側臥於床患足拿與無患足齊貼損傷膏用布二條長五寸寬二寸裹膏藥上外以紙包杉木板八片長七寸又用布三條與木板和扎齊緊先進活血止痛散次投壯筋續骨丹大小腿皮破骨斷者拿骨平正貼損傷膏用杉木板六片長二寸半上骨斷板寬七分下骨斷板寬五分加布扎緊取其擔力不致歪走此症痛極先以止痛丹後投壯筋續骨丹膝骱處油盞骨在膝蓋之處其骱脫出於上者使患者仰臥一人抬起足踝若出於左隨左而下出於右隨右而下醫者緩緩雙手挾擒上手拿住其膝下手擒住其足彎使骱對膝上手擒膝下手向上一抬則上貼損傷膏服壯筋續骨丹膝蓋離位向外側者則內筋腫脹向內側者則筋直起灣腫看其骨如何斜錯依法捏拿復其原位服補筋藥膝蓋骨名護膝骨有傷為兩塊者或三塊將兩腳伸直捏其骨平伏用薄篾片照膝蓋骨之大小做一篾圈套於患上次以布四條扣於圈上連膝灣扎緊先貼損傷膏服止痛接骨丹不必換膏藥受傷足放床上不可下地半月後用軟棉放足灣處逐日墊高使灣曲如舊常煮鴨食又恐碎骨未長好復行損傷將馬桶墊與床一樣高以大便不可下水洗至全好去篾圈如箍月餘骨仍兩片者一生跛足不可治服當歸湯當歸乳香沒藥川斷陳皮五加皮生地牛膝骨碎補紅花木瓜如發熱加柴胡桔梗各一錢發腫加黃芩水酒各半煎空心服小腿有二骨一大一小斷一根者易治斷兩根者難治直挺者易治分兩段者難治將傷骨捏對平正敷金瘡藥貼損傷膏不可水洗用木板六片長三寸五分加布條扎好二日一換此症極痛先服接骨丹次以壯筋續骨丹腳踝骨易出易入一手抬住其腳踝一手拿住其腳踝將踝拔直捏正其骨復於舊位左踝出手偏於左右踝出手偏於右腳指曲上腳跟曲下一伸而上骱有響聲活動如故夾以木板加布扎緊二日後再看如未平直仍撥端正貼損傷膏服寬筋活血散若行走過早使胻骨斜出向內歪者則內踝突出腫大向外歪者則外踝突出腫大須待氣血充足方可行動足背之骨縫錯出輕輕搓捏令其骨合筋舒貼損傷膏服補筋藥腳指撇傷前半截翻下斷者或翻上斷將左手捏住其足兩側再以右手捏平斷足指鑲接原位貼損傷膏以帶扎緊不可下水洗服壯筋續骨丹手足之筋多在指指傷覺痛則筋必促煎寬筋散熏洗輕輕揉捏再行搖動伸舒如骨與筋斷者不可熏洗失枕有因臥者有一時之誤者使患者坐低處先行揉摩一手提起其頭一手托住其下頦緩緩轉動伸舒使直服吉利散凡傷過重大便不通者用牙皂末蜜丸如青果大插入肛門內即通戳傷內臟或大腸者不治傷口淺直者易治血出不止服止血定痛散傷口深斜者待流血止摻金瘡藥服護風托裡散凡碰擦磕跌並刀砍斧斫肉開血流或皮微破者傷不過重人每不甚介意惟在春令最易侵風在頭為重別處稍輕漸見浮腫速進玉真散避風為要若不急治成破傷風甚至青腫牙關緊閉神昏發狂角弓反張四肢抽搐多致不救玉真散天麻八分羌活六分防風白附子川芎白芷各一錢煎服刀斧砍傷硬處者骨損先療骨砍傷軟處者肉損先治肉如傷頭額者敷金瘡藥以避風為上防身發寒熱脈沉細者易治脈洪大者難醫以刀刎喉左手執刀者斜而深右手執刀者直而淺刎一刀者深而難治刎兩刀者淺而易療如喉管斷有出入之氣摻藥吸進必嗆咳急以雞蛋內衣蓋管上再摻藥則不嗆如破食管或破半邊或全斷急以油線縫合其口若血不止用滑石五倍研末摻之外封金瘡藥貼膏藥長五寸闊三寸加布條扎項高枕仰臥使項屈而不伸刀口易合三日後以蔥湯洗去前藥摻生肌散貼膏藥仍舊扎好兩月餘完全服護風散如發寒熱進補中益氣湯若氣管斷或稍穿破者不治傷破肚皮而腸拖出者醫者先自剪去指甲免碰傷其腸將溫水和麻油浴暖外出之腸輕輕揉進若未能進用醋和冷水勿令患者知忽噴其面其腸自收以油線淺淺縫其口太深則傷內肉封金瘡藥貼活雞皮加布扎好服通腸活血湯內臟不傷飲食如常者不妨腸突出膜外者不治如腸未出而膜已穿血向內流者不治桑根皮搓線尤妙骨碎如粟米者輕輕箝去其碎骨封金瘡藥服生血補髓丹如骨脫臼捏平其骨合筍貼損傷膏服壯筋續骨丹從高墜跌骨碎者或骨脫骱者以手輕輕捏骨與骱平伏敷定痛散外護金瘡藥投疏風理氣湯次以補中益氣湯如頸項跌入腔內尚活動掉於左右治以提法頭低不起治以正法頭頂歪斜治以整法面仰頭不能低或筋長骨錯或筋聚筋強治以推正接整法能起坐行動者輕昏迷不語痛極硬腫者重登高墜斷肋骨者以手拿骨平伏貼損傷膏加布扎好服接骨散如食飽墜傷腸斷者不治捏破陰囊卵子拖出者浴以溫湯輕輕拈進貼以活雞皮先摻金瘡藥投吉利散卵子碎者不治捏傷陽物小便不通者急投琥珀丸小便通者進吉利散踢傷肛門腫脹者投通腸活血湯大便不通者以大黃湯有紫血者與吉利散有鮮血者進槐花散火燒湯燙炮打各傷者不能飲食者火毒入內臟時想飲冷水急以清心去毒飲能飲食者火毒未入內傷破皮肉者外敷琥珀膏投去毒散剁落耳鼻者急趁血熱蘸發灰末貼於原位不可歪斜外加夾縛法或斬斷手臂或手指或腿膀或足指急將斷下者趁血未冷湊接齊整合攏摻止血丹外敷金瘡藥服托裡止痛散如血已冷湊接不得黏合遂成殘缺之體橋梁牆垣倒壓折傷骨節傷頭顱骨碎者箝去碎骨收口方無後患防染破傷風服護風托裡散次以接骨散傷兩太陽昏迷不醒飲食不入言語不出者不治腦漿出者不治傷胸前背後及五臟者雖不言不食殆氣悶於中投吉利散身發寒熱以疏風理氣湯傷兩邊軟肋者飲食如故服吉利散傷腰子過重者不治輕者貼損傷膏服補腎和血湯踢傷小腹者傷處作痛小便閉塞不能行步三日可治內有瘀血以行氣活血湯孕婦小腹受足踢者不治受傷紫腫痛難忍者以活血止痛湯次服吉利散腫而青紫或發寒熱或二便閉氣悶昏沉坐臥不安不進飲食卵子不時上下此瘀血在內先以疏風理氣湯次投琥珀丸如紅腫陳陳作痛氣喘發咳欲笑溺澀投活血止痛湯踢傷海底穴者腫而紅紫痛不可忍貼損傷膏服活血止痛湯次以吉利散腫而青黑者身發寒熱小便不通氣悶腹痛陰子或上或下內有瘀血貼損傷膏以行氣活血湯次進琥珀丸肛門腫痛二便不通者發熱食少坐臥不安服疏風順氣湯次投琥珀丸紅腫不消陳陳作痛氣喘發咳或笑或哭小便澀滯先以活血止痛湯次進吉利散後服藥酒而愈如初受傷昏迷不語者口出唾涎喉鼻喘息面白胸腹氣動脈沉細者可治先吹牙皂末鼻中取嚏次以砂仁泡湯煎吉利散再投活血止痛湯貼損傷膏刀斧傷者為金瘡淡黃色者易治紫黑色者難治忌咳嗽嘔噦避風為妙如風入傷口則浮腫多涕淚痰湧牙關緊閉角弓反張成破傷風者不治急以壁喜窩香灰加麝香敷傷處投疏風理氣湯如犯怒氣瘡迸裂犯欲瘡口腐臭用乳香沒藥滴乳石血竭為末敷之患者當避風寒戒色忍氣息怒散心節飲食忌食雞鵝醋蛋牛羊肉筍面煎炒發物許真人曰人受刀斧所傷血出多者必渴不可與水飲如飲熱湯則血沸血沸出必死忌惱怒二忌喜笑三忌大言四忌勞力五忌妄想六忌食羹粥七忌飲酒八忌酸鹹前有別症而受傷在後者兩兼而用藥孕婦當服安胎順氣藥受杖後者腿必紫黑甚者氣悶攻心而死速服酒沖童便外用熱豆腐敷之其腐即紫頻換豆腐至色淡為度或搗熱蔥尉之或用大黃末童便和敷內服化瘀藥受夾棍後者急用熱童便一盆浸之如童便冷燒熱磚淬之則熱浸至童便面起白油者方止外搗肥皂和雞子清敷之加布扎緊或搗何首烏敷之內服逐瘀定痛藥應用諸方止血定痛散生南星二錢生大黃降香末三錢蒲黃炭一錢五分血竭煅龍骨二錢黃連兒茶一錢五分綿花灰陳石灰三錢富者加牛黃一錢犀角屑一錢為末加擂工至無聲乾摻封口金瘡藥治破爛未收口者能生肌肉乳香沒藥各四錢木鱉仁輕粉二錢煅龍骨血竭白芨老松香虻蟲白蘞各一錢五倍子二錢各藥曬研細末聽用將熟豬油八兩菜油八兩同熬透入白蠟三錢化熔再入藥末攪勻攤貼損傷膏藥真自然銅煅七次一兩骨碎補大黃當歸各一兩乳香沒藥六錢月石一兩細辛丁香各五錢蘇木末一兩川烏草烏生南星茜根各五錢靈仙羌活獨活三稜莪朮川斷良薑官桂吳萸地鱉蟲牙皂落得打劉寄奴不留行阿魏接骨草各八錢三七麻黃樟腦蟾酥各五錢蜈蚣十條蛇